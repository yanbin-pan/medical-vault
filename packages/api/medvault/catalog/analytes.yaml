  - code: MV:gallbladder.width
    name: Gallbladder width
    unit: mm
    category: ultrasound-abdomen
    body_site: gallbladder
    synonyms: [胆囊宽径, 胆囊前后径]
  - code: MV:gallbladder.wall-thickness
    name: Gallbladder wall thickness
    unit: mm
    category: ultrasound-abdomen
    body_site: gallbladder
    higher_is_worse: true
    synonyms: [胆囊壁厚, 胆囊壁厚度, 壁厚]
  - code: MV:common-bile-duct.diameter
    name: Common bile duct diameter
    unit: mm
    category: ultrasound-abdomen
    body_site: common-bile-duct
    higher_is_worse: true
    synonyms: [胆总管内径, 胆总管]
  - code: MV:pancreas.thickness
    name: Pancreas thickness
    unit: mm
    category: ultrasound-abdomen
    body_site: pancreas
    synonyms: [胰腺厚度, 胰腺厚, 胰头厚]
  - code: MV:spleen.thickness
    name: Spleen thickness
    unit: mm
    category: ultrasound-abdomen
    body_site: spleen
    higher_is_worse: true
    synonyms: [脾脏厚度, 脾厚, 脾脏厚]
  - code: MV:spleen.length
    name: Spleen length
    unit: mm
    category: ultrasound-abdomen
    body_site: spleen
    higher_is_worse: true
    synonyms: [脾脏长径, 脾长, 脾脏长]
  - code: MV:kidney.length
    name: Kidney length
    unit: mm
    category: ultrasound-abdomen
    body_site: kidney
    synonyms: [肾脏长径, 肾长径, 肾脏长, kidney length]
  - code: MV:kidney.width
    name: Kidney width
    unit: mm
    category: ultrasound-abdomen
    body_site: kidney
    synonyms: [肾脏宽径, 肾宽径, 肾脏宽]
  - code: MV:kidney.thickness
    name: Kidney thickness
    unit: mm
    category: ultrasound-abdomen
    body_site: kidney
    synonyms: [肾脏厚径, 肾厚径, 肾脏厚]

  # -------------------------------------------------------- vascular ultrasound
  - code: MV:artery.intima-media-thickness
    name: Intima-media thickness
    unit: mm
    category: ultrasound-vascular
    higher_is_worse: true
    synonyms: [IMT, 内中膜厚度, 内膜中层厚度, 内膜厚度, 内膜/中膜, intima-media thickness]
  - code: MV:artery.diameter
    name: Arterial diameter
    unit: mm
    category: ultrasound-vascular
    synonyms: [血管内径, 内径, 前后径, arterial diameter]
  - code: MV:artery.peak-systolic-velocity
    name: Peak systolic velocity
    unit: cm/s
    category: ultrasound-vascular
    synonyms: [PSV, 收缩期峰值流速, 峰值流速, 血流速峰值, peak systolic velocity]
  - code: MV:artery.end-diastolic-velocity
    name: End diastolic velocity
    unit: cm/s
    category: ultrasound-vascular
    synonyms: [EDV, 舒张末期流速, 舒张期末流速]
  - code: MV:artery.resistive-index
    name: Resistive index
    unit: '1'
    category: ultrasound-vascular
    higher_is_worse: true
    synonyms: [RI, 阻力指数]

# Body sites, so that "left kidney" and "right kidney" become two comparable
# series rather than one interleaved mess. Laterality is stored separately.
# Single-character synonyms are deliberately absent: see Catalog._detect_site.
# 胆 alone would match 胆固醇 (cholesterol) and file it under the gallbladder.
body_sites:
  - {code: liver, name: Liver, synonyms: [肝脏]}
  - {code: gallbladder, name: Gallbladder, synonyms: [胆囊]}
  - {code: pancreas, name: Pancreas, synonyms: [胰腺]}
  - {code: spleen, name: Spleen, synonyms: [脾脏]}
  - {code: kidney, name: Kidney, synonyms: [肾脏]}
  - {code: portal-vein, name: Portal vein, synonyms: [门静脉, 门脉]}
  - {code: inferior-vena-cava, name: Inferior vena cava, synonyms: [下腔静脉]}
  - {code: common-bile-duct, name: Common bile duct, synonyms: [胆总管]}
  - {code: common-carotid-artery, name: Common carotid artery, synonyms: [颈总动脉, 颈总A]}
  # Generic carotid, for narrative lines that name no specific branch.
  - {code: carotid-artery, name: Carotid artery, synonyms: [颈动脉]}
  - {code: internal-carotid-artery, name: Internal carotid artery, synonyms: [颈内动脉, 颈内A]}
  - {code: external-carotid-artery, name: External carotid artery, synonyms: [颈外动脉, 颈外A]}
  - {code: vertebral-artery, name: Vertebral artery, synonyms: [椎动脉, 椎A]}
  - {code: thyroid, name: Thyroid, synonyms: [甲状腺]}

laterality:
  left: [左, 左侧, L, left]
  right: [右, 右侧, R, right]
  bilateral: [双侧, 两侧, bilateral, both]
