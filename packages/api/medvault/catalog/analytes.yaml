    synonyms: [DBP, 舒张压, diastolic]
  - code: LOINC:29463-7
    name: Body weight
    unit: kg
    category: vitals
    synonyms: [体重, weight]
  - code: LOINC:39156-5
    name: Body mass index
    unit: kg/m2
    category: vitals
    higher_is_worse: true
    synonyms: [BMI, 体重指数, 身体质量指数]

  # ------------------------------------------------------- abdominal ultrasound
  # LOINC does not code individual organ dimensions, so these use the local
  # `MV:` namespace. The naming pattern is organ.site.measurement.
  - code: MV:liver.right-lobe.oblique-diameter
    name: Liver right lobe oblique diameter
    unit: mm
    category: ultrasound-abdomen
    body_site: liver
    synonyms: [右肝斜径, 肝右叶斜径, right hepatic oblique diameter]
  - code: MV:liver.left-lobe.thickness
    name: Liver left lobe thickness
    unit: mm
    category: ultrasound-abdomen
    body_site: liver
    synonyms: [左肝厚径, 左肝厚度, 肝左叶厚径]
  - code: MV:liver.left-lobe.length
    name: Liver left lobe length
    unit: mm
    category: ultrasound-abdomen
    body_site: liver
    synonyms: [左肝长径, 肝左叶长径]
  - code: MV:portal-vein.diameter
    name: Main portal vein diameter
    unit: mm
    category: ultrasound-abdomen
    body_site: portal-vein
    synonyms: [MPV, 门静脉内径, 门静脉主干内径, 门脉内径]
  - code: MV:inferior-vena-cava.diameter
    name: Inferior vena cava diameter
    unit: mm
    category: ultrasound-abdomen
    body_site: inferior-vena-cava
    synonyms: [IVC, 下腔静脉内径]
  - code: MV:gallbladder.length
    name: Gallbladder length
