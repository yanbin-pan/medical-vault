# The analyte catalogue.
#
# This file is DATA, not schema. Adding a measurement that nobody had thought of
# when this was written means appending an entry here — no migration, no code
# change, no downtime. Observations whose label matches nothing here are still
# stored, under an `UNMAPPED:` code with their printed label intact, and are
# picked up automatically once an entry is added and `medvault reindex` runs.
#
# Fields:
#   code            canonical identity, `SYSTEM:CODE`. Prefer LOINC; `MV:` is
#                   the local namespace for things LOINC does not cover.
#   name            English display name.
#   unit            canonical unit. Every value for this analyte is converted
#                   to it so a decade of results share one axis.
#   category        groups the analyte in the UI and in correlation views.
#   synonyms        every printed spelling seen in the wild, any language.
#                   Matching is case- and punctuation-insensitive.
#   body_site       default site, for measurements that imply one.
#   higher_is_worse used only to colour the UI; never to decide anything.
#
# The synonym lists lean heavily on Chinese because that is where these reports
# come from. They are lowercased before comparison, so case here is cosmetic.

version: 3
analytes:

  # ---------------------------------------------------------------- haematology
  - code: LOINC:6690-2
    name: White blood cell count
    unit: 10*9/L
    category: haematology
    synonyms: [WBC, 白细胞, 白细胞计数, 白血球, leukocytes, leucocyte count]
  - code: LOINC:789-8
    name: Red blood cell count
    unit: 10*12/L
    category: haematology
    synonyms: [RBC, 红细胞, 红细胞计数, erythrocytes]
  - code: LOINC:718-7
    name: Haemoglobin
    unit: g/L
    category: haematology
    synonyms: [HGB, HB, 血红蛋白, 血色素, hemoglobin, haemoglobin]
  - code: LOINC:4544-3
    name: Haematocrit
    unit: '%'
    category: haematology
    synonyms: [HCT, 红细胞压积, 血细胞比容, hematocrit]
  - code: LOINC:777-3
    name: Platelet count
    unit: 10*9/L
    category: haematology
    synonyms: [PLT, 血小板, 血小板计数, platelets]
  - code: LOINC:787-2
    name: Mean corpuscular volume
    unit: fL
    category: haematology
    synonyms: [MCV, 平均红细胞体积]
  - code: LOINC:785-6
    name: Mean corpuscular haemoglobin
    unit: pg
    category: haematology
    synonyms: [MCH, 平均红细胞血红蛋白量]
  - code: LOINC:786-4
    name: Mean corpuscular haemoglobin concentration
    unit: g/L
    category: haematology
    synonyms: [MCHC, 平均红细胞血红蛋白浓度]
  - code: LOINC:770-8
    name: Neutrophils percentage
    unit: '%'
    category: haematology
    synonyms: [NEUT%, 中性粒细胞百分比, 中性粒细胞比率, neutrophil %]
  - code: LOINC:736-9
    name: Lymphocytes percentage
    unit: '%'
    category: haematology
    synonyms: [LYMPH%, 淋巴细胞百分比, 淋巴细胞比率]
  - code: LOINC:30180-4
    name: Erythrocyte sedimentation rate
    unit: mm/h
    category: haematology
    synonyms: [ESR, 血沉, 红细胞沉降率]

  # ------------------------------------------------------------------ metabolic
  - code: LOINC:2345-7
    name: Glucose, fasting
    unit: mmol/L
    category: metabolic
    higher_is_worse: true
    synonyms: [GLU, 血糖, 空腹血糖, 葡萄糖, fasting glucose, glucose]
  - code: LOINC:4548-4
    name: Haemoglobin A1c
    unit: '%'
    category: metabolic
    higher_is_worse: true
    synonyms: [HbA1c, A1c, 糖化血红蛋白]
  - code: LOINC:2093-3
    name: Cholesterol, total
    unit: mmol/L
    category: lipids
    higher_is_worse: true
    synonyms: [TC, CHOL, 总胆固醇, 胆固醇, total cholesterol]
  - code: LOINC:2085-9
    name: HDL cholesterol
    unit: mmol/L
    category: lipids
    higher_is_worse: false
    synonyms: [HDL, HDL-C, 高密度脂蛋白, 高密度脂蛋白胆固醇]
  - code: LOINC:2089-1
    name: LDL cholesterol
    unit: mmol/L
    category: lipids
    higher_is_worse: true
    synonyms: [LDL, LDL-C, 低密度脂蛋白, 低密度脂蛋白胆固醇]
  - code: LOINC:2571-8
    name: Triglycerides
    unit: mmol/L
    category: lipids
    higher_is_worse: true
    synonyms: [TG, 甘油三酯, 三酰甘油]
  - code: LOINC:3084-1
    name: Uric acid
    unit: umol/L
    category: metabolic
    higher_is_worse: true
    synonyms: [UA, 尿酸]

  # ---------------------------------------------------------------------- liver
  - code: LOINC:1742-6
