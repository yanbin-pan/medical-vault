  - code: LOINC:6768-6
    name: Alkaline phosphatase
    unit: U/L
    category: liver
    synonyms: [ALP, AKP, 碱性磷酸酶]
  - code: LOINC:1975-2
    name: Bilirubin, total
    unit: umol/L
    category: liver
    higher_is_worse: true
    synonyms: [TBIL, 总胆红素]
  - code: LOINC:1968-7
    name: Bilirubin, direct
    unit: umol/L
    category: liver
    higher_is_worse: true
    synonyms: [DBIL, 直接胆红素, 结合胆红素]
  - code: LOINC:2885-2
    name: Protein, total
    unit: g/L
    category: liver
    synonyms: [TP, 总蛋白]
  - code: LOINC:1751-7
    name: Albumin
    unit: g/L
    category: liver
    synonyms: [ALB, 白蛋白]

  # --------------------------------------------------------------------- kidney
  - code: LOINC:2160-0
    name: Creatinine
    unit: umol/L
    category: kidney
    higher_is_worse: true
    synonyms: [CREA, CR, 肌酐, 血肌酐]
  - code: LOINC:3094-0
    name: Urea nitrogen
    unit: mmol/L
    category: kidney
    higher_is_worse: true
    synonyms: [BUN, UREA, 尿素氮, 尿素]
  - code: LOINC:33914-3
    name: Estimated glomerular filtration rate
    unit: mL/min/{1.73_m2}
    category: kidney
    higher_is_worse: false
    synonyms: [eGFR, GFR, 肾小球滤过率]

  # -------------------------------------------------------------------- thyroid
  - code: LOINC:3016-3
    name: Thyroid stimulating hormone
    unit: m[IU]/L
    category: endocrine
    synonyms: [TSH, 促甲状腺激素]
  - code: LOINC:3053-6
    name: Free triiodothyronine
    unit: pmol/L
    category: endocrine
    synonyms: [FT3, 游离三碘甲状腺原氨酸]
  - code: LOINC:3024-7
