    category: liver
    higher_is_worse: true
    synonyms: [ALT, GPT, 丙氨酸氨基转移酶, 谷丙转氨酶]
  - code: LOINC:1920-8
    name: Aspartate aminotransferase
    unit: U/L
    category: liver
    higher_is_worse: true
    synonyms: [AST, GOT, 天门冬氨酸氨基转移酶, 谷草转氨酶]
  - code: LOINC:2324-2
