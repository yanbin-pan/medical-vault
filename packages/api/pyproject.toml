[project]
name = "medvault"
version = "0.1.0"
description = "Medical Vault — a durable, portable record of medical results"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "python-multipart>=0.0.17",
    "anthropic>=0.69",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "numpy>=1.26",
    "pillow>=11.0",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
medvault = "medvault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medvault"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `Depends(...)` and `File(...)` in a parameter default is how FastAPI
    # declares dependencies. B008 flags every one of them, and there is no way
    # to express the same thing without it.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Test names are long because they describe a behaviour rather than a function,
# and the fixtures embed Chinese labels that ruff counts by code point.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
