name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: packages/api
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        working-directory: packages/api
        run: .venv/bin/ruff check medvault tests
      - name: Test
        working-directory: packages/api
        run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: packages/web
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        working-directory: packages/web
        run: npm run build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a plaintext secret
        # Committing an unencrypted Secret would put an API key in git history,
        # where deleting it later does not remove it. Catching it here is the
        # only cheap moment.
        run: |
          if [ -f k8s/secret.sops.yaml ]; then
            if ! grep -q 'ENC\[' k8s/secret.sops.yaml; then
              echo "::error file=k8s/secret.sops.yaml::not SOPS-encrypted; run 'sops --encrypt --in-place k8s/secret.sops.yaml'"
              exit 1
            fi
            echo "secret is encrypted ($(grep -c 'ENC\[' k8s/secret.sops.yaml) values)"
          else
            echo "no secret committed yet"
          fi

      - name: Build manifests
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar xz
          # Flux supplies the decrypted Secret; stand in a placeholder so the
          # rest of the kustomization can be validated here.
          if [ ! -f k8s/secret.sops.yaml ]; then
            sed '/^#/d' k8s/secret.sops.yaml.example > k8s/secret.sops.yaml
          fi
          ./kustomize build k8s/ > /dev/null
          echo "manifests build"
