apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-vault
  namespace: medical-vault
spec:
  replicas: 1
  strategy:
    # Recreate, and one replica only. The vault PVC is ReadWriteOnce, and two
    # pods appending to the same document directory over NFS is exactly the
    # failure this repository is designed to avoid.
    type: Recreate
  selector:
    matchLabels: {app: medical-vault}
  template:
    metadata:
      labels: {app: medical-vault}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        # Brings the projection up to date before the API starts serving.
        #
        # `--if-needed` makes this a no-op on an ordinary deploy: the database
        # is on its own volume and survives restarts, so there is nothing to do
        # unless it is empty or the analyte catalogue has changed. That second
        # case is the useful one — a catalogue bump means every stored code and
        # canonical unit was derived under old rules, so the rebuild is exactly
        # what retrofits the whole history.
        - name: reindex
          image: ghcr.io/yanbin-pan/medical-vault:0.1.0
          command: [sh, -ec]
          args:
            - |
              medvault init-db
              medvault reindex --if-needed
          env: &medvault_env
            - name: MEDVAULT_VAULT_PATH
              value: /data/vault
            # SQLite on its own SSD-backed volume, mounted below. The journal
            # mode is not set here: the application detects that this path is on
            # an NFS mount and drops from WAL to a rollback journal by itself,
            # because WAL cannot work across a network filesystem.
            - name: MEDVAULT_DATABASE_URL
              value: sqlite:////cache/medvault.db
            - name: MEDVAULT_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: medical-vault, key: anthropic-api-key}
            # Cloudflare Access authenticates every request at the edge and sets
            # this header itself, stripping any copy the client sent. Trusting it
            # is only safe because the tunnel is the sole route to this pod —
            # see docs/operations.md before turning it off.
            - name: MEDVAULT_TRUST_ACCESS_HEADER
              value: "true"
            - name: MEDVAULT_WEB_ROOT
              value: /app/web
          volumeMounts: &medvault_mounts
            - name: vault
              mountPath: /data/vault
            - name: cache
              mountPath: /cache
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      containers:
        - name: api
          image: ghcr.io/yanbin-pan/medical-vault:0.1.0
          ports:
            - containerPort: 8000
          env: *medvault_env
          volumeMounts: *medvault_mounts
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            # Reading a document holds a downscaled image and the model's reply
            # in memory. 768Mi is comfortable; below ~512Mi uploads start failing
            # under Pillow rather than anywhere obvious.
            limits: {memory: 768Mi}
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: medical-vault-data
        - name: cache
          persistentVolumeClaim:
            claimName: medical-vault-cache
---
apiVersion: v1
kind: Service
metadata:
  name: medical-vault
  namespace: medical-vault
spec:
  selector: {app: medical-vault}
  ports:
    - port: 80
      targetPort: 8000
