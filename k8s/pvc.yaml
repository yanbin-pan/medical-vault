# The vault. This is the only stateful thing in the deployment, and the only
# irreplaceable one.
#
# No storageClassName, so it lands on `ssd` — NFS-backed on rpi-01's SSD and
# included in the nightly backup. Putting it on `local-path` would place a
# decade of medical records on one node's SD card, unbacked-up and lost on a node
# rebuild. See apps/README.md in home-cluster.
#
# There is deliberately no second volume for the database. The projection is a
# cache that the pod rebuilds from these files on every start, so it lives in an
# emptyDir — see deployment.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medical-vault-data
  namespace: medical-vault
spec:
  accessModes:
    # ReadWriteOnce is what stops two API pods writing the vault at once.
    - ReadWriteOnce
  resources:
    requests:
      # Photographs of paper reports, a few hundred KB each. 20Gi is years of them.
      storage: 20Gi
